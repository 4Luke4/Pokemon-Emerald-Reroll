name: Create ROM release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Publish a stable release or a marked pre-release
        required: true
        type: choice
        options:
          - stable
          - prerelease
      tag_name:
        description: Stable v1.2.3 or pre-release v1.2.3-beta.4
        required: true
        type: string
      rights_attestation:
        description: I confirm that this repository may publish the built ROM
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish ${{ inputs.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release request
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          RIGHTS_ATTESTATION: ${{ inputs.rights_attestation }}
          TAG_NAME: ${{ inputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stable_pattern='^v[0-9]\.[0-9]\.[0-9]$'
          prerelease_pattern='^v[0-9]\.[0-9]\.[0-9]-(alpha|beta|pre)\.[0-9]$'

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "error: releases must be dispatched from the main branch" >&2
            exit 1
          fi
          if [[ "${RIGHTS_ATTESTATION}" != "true" ]]; then
            echo "error: rights attestation is required" >&2
            exit 1
          fi

          case "${RELEASE_TYPE}" in
            stable)
              [[ "${TAG_NAME}" =~ ${stable_pattern} ]] || {
                echo "error: stable tags must match v[0-9].[0-9].[0-9]" >&2
                exit 1
              }
              ;;
            prerelease)
              [[ "${TAG_NAME}" =~ ${prerelease_pattern} ]] || {
                echo "error: pre-release tags must match v[0-9].[0-9].[0-9]-(alpha|beta|pre).[0-9]" >&2
                exit 1
              }
              ;;
            *)
              echo "error: unsupported release type ${RELEASE_TYPE}" >&2
              exit 1
              ;;
          esac

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "error: GitHub release ${TAG_NAME} already exists" >&2
            exit 1
          fi

      - name: Set up cached build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Build and validate versioned ROM
        env:
          UPSTREAM_REF: ${{ steps.setup.outputs.upstream-sha }}
          VERSION: ${{ inputs.tag_name }}
        run: |
          VERSION="${VERSION#v}" ./scripts/build-rom.sh
          (cd dist && sha256sum ./*.gba > rom.sha256)
          test -s dist/upstream.sha

      - name: Create or verify annotated tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${TAG_NAME}" >/dev/null; then
            if [[ "$(git cat-file -t "refs/tags/${TAG_NAME}")" != "tag" ]]; then
              echo "error: existing ${TAG_NAME} is not an annotated tag" >&2
              exit 1
            fi
            tagged_commit="$(git rev-list --max-count=1 "${TAG_NAME}")"
            if [[ "${tagged_commit}" != "${GITHUB_SHA}" ]]; then
              echo "error: ${TAG_NAME} already points to ${tagged_commit}" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${TAG_NAME}" "${GITHUB_SHA}" \
              --message "Pokémon Emerald: Reroll ${TAG_NAME}"
            git push origin "refs/tags/${TAG_NAME}"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          TAG_NAME: ${{ inputs.tag_name }}
          UPSTREAM_SHA: ${{ steps.setup.outputs.upstream-sha }}
        run: |
          release_flags=(--verify-tag --generate-notes)
          if [[ "${RELEASE_TYPE}" == "prerelease" ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          gh release create "${TAG_NAME}" \
            dist/*.gba \
            dist/rom.sha256 \
            dist/upstream.sha \
            --title "Pokémon Emerald: Reroll ${TAG_NAME}" \
            --notes "Built from Reroll ${GITHUB_SHA} against upstream ${UPSTREAM_SHA}." \
            "${release_flags[@]}"
