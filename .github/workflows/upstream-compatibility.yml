name: Upstream compatibility

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compatibility
  cancel-in-progress: true

jobs:
  latest-stable:
    name: Protected default branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Reroll
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up cached build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Resolve and build latest stable upstream
        env:
          UPSTREAM_REF: ${{ steps.setup.outputs.upstream-sha }}
        run: ./scripts/build-rom.sh

      - name: Record compatibility result
        run: |
          sha256sum dist/*.gba > dist/rom.sha256
          find dist -type f -name '*.gba' -delete
          {
            echo "## Upstream compatibility"
            echo
            echo "Resolved commit: \`$(<dist/upstream.sha)\`"
            echo
            echo "The patched modern ROM built and passed header validation."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload non-distributable metadata
        uses: actions/upload-artifact@v6
        with:
          name: upstream-compatibility-metadata
          path: |
            dist/rom.sha256
            dist/upstream.sha
          if-no-files-found: error
          retention-days: 30
