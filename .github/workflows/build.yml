name: Build and verify ROM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Modern toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Reroll
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up cached build
        id: setup
        uses: ./.github/actions/setup-build

      - name: Build and validate ROM
        env:
          UPSTREAM_REF: ${{ steps.setup.outputs.upstream-sha }}
        run: ./scripts/build-rom.sh

      - name: Record non-distributable build metadata
        run: |
          sha256sum dist/*.gba > dist/rom.sha256
          test -s dist/upstream.sha
          find dist -type f -name '*.gba' -delete

      - name: Upload checksum only
        uses: actions/upload-artifact@v6
        with:
          name: rom-build-metadata
          path: |
            dist/rom.sha256
            dist/upstream.sha
          if-no-files-found: error
          retention-days: 14
