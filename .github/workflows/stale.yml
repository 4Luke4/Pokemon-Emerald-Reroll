name: Manage inactive conversations

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Process inactivity
        uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 21
          days-before-pr-stale: 45
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,pinned,roadmap
          exempt-pr-labels: security,pinned,work-in-progress
          stale-issue-message: >-
            This issue has had no activity for 60 days. Add current reproduction
            details or implementation context within 21 days to keep it open.
          close-issue-message: >-
            Closing after the inactivity window. A focused issue with current
            evidence is welcome if the problem remains reproducible.
          stale-pr-message: >-
            This pull request is inactive. It will remain open, but please rebase
            it and report current test results before requesting another review.
